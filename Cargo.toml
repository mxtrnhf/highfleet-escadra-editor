[package]
name = "hf-hee"
version = "0.1.1"
edition = "2021"
description = "Highfleet Escadra Editor (HEE): config-driven edits to every hard-coded enemy ship pool (strike groups, tactical groups, garrisons, general enemies). Steam 1.163."

[lib]
name = "hf_hee"
crate-type = ["cdylib"]

[dependencies]
highfleet-mod-api = { git = "https://github.com/logdot/Highfleet-Modloader.git", tag = "v4.0.0" }
log = "0.4.28"
serde = { version = "1.0.221", features = ["derive"] }
serde_json = "1.0.144"
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader"] }
